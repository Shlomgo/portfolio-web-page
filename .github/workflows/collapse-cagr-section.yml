name: Collapse CAGR comparison section

on:
  push:
    paths:
      - '.github/workflows/collapse-cagr-section.yml'

permissions:
  contents: write

jobs:
  update-section:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply CAGR section update
        run: python3 .github/scripts/collapse_cagr_section.py

      - name: Check JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text()
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', s, flags=re.S)
          inline = [x for x in scripts if x.strip()]
          Path('/tmp/site.js').write_text(inline[-1])
          PY
          node --check /tmp/site.js

      - name: Verify section structure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text()
          required = [
            '<details class="comparison-details">',
            '<summary class="comparison-summary">',
            'Modeled rental CAGR (reinvesting cash flow)',
            'S&amp;P 500 benchmark (9% annually)',
            '<div class="comparison-explainer">',
            '<h3>What this chart shows</h3>',
            '<h3>Why the rental percentage declines</h3>',
          ]
          missing = [x for x in required if x not in s]
          if missing:
            raise SystemExit('Missing required content: ' + repr(missing))
          if 'comparison-info' in s[s.find('<section class="comparison-section">'):s.find('</section>', s.find('<section class="comparison-section">'))]:
            raise SystemExit('Comparison info popup still present')
          print('CAGR section structure verified')
          PY

      - name: Commit update
        run: |
          rm .github/workflows/collapse-cagr-section.yml .github/scripts/collapse_cagr_section.py
          git config user.name "Open Book updater"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/collapse-cagr-section.yml .github/scripts/collapse_cagr_section.py
          git commit -m "Make CAGR section expandable"
          git push origin HEAD:main
