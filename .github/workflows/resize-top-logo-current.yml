name: Resize top logo current

on:
  push:
    paths:
      - '.github/workflows/resize-top-logo-current.yml'

permissions:
  contents: write

jobs:
  resize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Double only the masthead logo from its current effective size
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = ".artemis-mark,\n.artemis-faq-mark,\n.artemis-footer-mark{width:164px;}\n@media (max-width:900px){\n  .artemis-mark,\n  .artemis-faq-mark,\n  .artemis-footer-mark{width:144px;}\n}\n@media (max-width:640px){\n  .artemis-mark,\n  .artemis-faq-mark,\n  .artemis-footer-mark{width:124px;}\n}"
          new = ".artemis-mark{width:328px;}\n.artemis-faq-mark,\n.artemis-footer-mark{width:164px;}\n@media (max-width:900px){\n  .artemis-mark{width:288px;}\n  .artemis-faq-mark,\n  .artemis-footer-mark{width:144px;}\n}\n@media (max-width:640px){\n  .artemis-mark{width:248px;}\n  .artemis-faq-mark,\n  .artemis-footer-mark{width:124px;}\n}"
          if old not in s:
              raise SystemExit('Expected effective logo override not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit corrected masthead resize
        run: |
          git config user.name 'Open Book updater'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Double top logo from current effective size'
          git push
