name: Apply refined Open Book theme

on:
  push:
    paths:
      - '.github/workflows/resize-top-logo-current.yml'

permissions:
  contents: write

jobs:
  refine-theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update index palette, typography, and theme link
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text()

          replacements = {
              '#14171c': '#141619',
              '#f5f4f0': '#EEEAE4',
              '#a8a6a0': '#B2AEAA',
              '#ece4d3': '#EEEAE4',
              '#4ade80': '#72B789',
              '#7fbd94': '#5E9872',
              '#16321f': '#18251E',
              '#285437': '#355646',
              '#38bdf8': '#72A5C2',
              '#7bafc9': '#608AA2',
              '#132430': '#182127',
              '#245068': '#385266',
              '#232720': '#1B1D20',
              '#3a3d38': '#3A3D42',
              '#E1B85F': '#B5A585',
              '#F0CF82': '#C8BDA5',
              '#78dff0': '#B2AEAA',
              'rgba(74,222,128': 'rgba(114,183,137',
              'rgba(56,189,248': 'rgba(114,165,194',
              'rgba(225,184,95': 'rgba(181,165,133',
              "font-family:'IBM Plex Sans',sans-serif;": "font-family:'Instrument Sans',sans-serif;",
              "font-family:'IBM Plex Sans', sans-serif;": "font-family:'Instrument Sans', sans-serif;",
          }
          for old, new in replacements.items():
              s = s.replace(old, new)

          s = re.sub(r'\n<!-- open-book-refined-theme:start -->.*?<!-- open-book-refined-theme:end -->\n', '\n', s, flags=re.S)
          s = re.sub(r'\n<link[^>]+id="instrument-sans-font"[^>]*>', '', s)
          s = re.sub(r'\n<link[^>]+id="refined-theme-css"[^>]*>', '', s)

          links = '''
<link id="instrument-sans-font" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link id="refined-theme-css" rel="stylesheet" href="refined-theme.css?v=20260904-1">
'''.strip()

          if '</head>' not in s:
              raise SystemExit('Could not find </head> in index.html')
          s = s.replace('</head>', links + '\n</head>', 1)
          p.write_text(s)
          PY

      - name: Verify theme references
        run: |
          grep -q "refined-theme.css" index.html
          grep -q "Instrument+Sans" index.html

      - name: Commit refined live-site styling
        run: |
          git config user.name 'Open Book updater'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No index changes needed.'
            exit 0
          fi
          git commit -m 'Refine site palette and typography'
          git push
