name: Stabilize Open Book property loading

on:
  push:
    paths:
      - '.github/workflows/stabilize-property-loading.yml'

permissions:
  contents: write

jobs:
  stabilize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download current same-origin property snapshot
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv, io, re, urllib.request

          html = Path('index.html').read_text()
          match = re.search(r'const SHEET_CSV_URL = "([^"]+)";', html)
          if not match:
              raise SystemExit('Could not find SHEET_CSV_URL in index.html')

          req = urllib.request.Request(match.group(1), headers={'User-Agent':'Mozilla/5.0 OpenBookStabilizer/1.0'})
          with urllib.request.urlopen(req, timeout=30) as response:
              data = response.read()

          text = data.decode('utf-8-sig')
          reader = csv.DictReader(io.StringIO(text))
          required = {'Purchase Price', 'State', 'Status'}
          fields = set(reader.fieldnames or [])
          if not required.issubset(fields):
              raise SystemExit(f'Unexpected CSV headers. Missing: {sorted(required - fields)}')
          rows = list(reader)
          if not rows:
              raise SystemExit('Google Sheet returned no data rows')
          Path('property-data.csv').write_bytes(data)
          print(f'Captured {len(rows)} source rows in property-data.csv')
          PY

      - name: Make table loading same-origin and restore return semantics
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()

          start = s.find('async function fetchSheetCsv(attempt){')
          end = s.find('\n\ninitSortableHeaders();', start)
          if start < 0 or end < 0:
              raise SystemExit('Could not locate the current property loader block.')

          replacement = r'''const PROPERTY_DATA_SNAPSHOT_URL = "property-data.csv";
          const PROPERTY_DATA_CACHE_KEY = "openBookPropertyDataCsvV2";

          function applyPropertyDataCsv(csvText, source){
            const rawRows = parseSheetCsv(csvText);
            const nextData = rawRows.map(rowToRecord).filter(d=>d.status !== "hide" && d.state && !isNaN(d.price) && d.price > 0);
            if(!nextData.length) throw new Error(`No usable property rows in ${source}.`);

            DATA = nextData;
            assignPropertyIds(DATA);
            console.log(`Loaded ${DATA.length} properties from ${source}.`);
            activeStates = new Set(DATA.map(d=>d.state));
            LEV_SCALE = LEV_MAX_PX / Math.max(...DATA.map(d=>d.price));
            buildFilterControls();
            render();
          }

          async function fetchPropertySnapshot(){
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 8000);
            try{
              const response = await fetch(`${PROPERTY_DATA_SNAPSHOT_URL}?v=${Date.now()}`, {
                method:'GET',
                cache:'no-store',
                credentials:'same-origin',
                signal:controller.signal
              });
              if(!response.ok) throw new Error(`Snapshot request returned ${response.status}`);
              const text = await response.text();
              if(!text || text.length < 20) throw new Error('Property snapshot was empty.');
              return text;
            } finally {
              clearTimeout(timer);
            }
          }

          async function loadData(){
            let snapshotError = null;
            try{
              const csvText = await fetchPropertySnapshot();
              applyPropertyDataCsv(csvText, 'same-origin snapshot');
              try{ localStorage.setItem(PROPERTY_DATA_CACHE_KEY, csvText); }catch(_err){}
              return;
            } catch(err){
              snapshotError = err;
              console.warn('Same-origin property snapshot failed; trying browser cache.', err);
            }

            try{
              const cached = localStorage.getItem(PROPERTY_DATA_CACHE_KEY);
              if(cached){
                applyPropertyDataCsv(cached, 'browser cache');
                return;
              }
            } catch(cacheError){
              console.warn('Property-data browser cache was unavailable.', cacheError);
            }

            console.error('Could not load property data:', snapshotError);
            showDataLoadError();
            if(stickyHeaderState.initialized){
              stickyHeaderState.shell.classList.remove('is-active');
            }
          }'''

          s = s[:start] + replacement + s[end:]
          s = s.replace('<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>\n', '')
          p.write_text(s)

          theme = Path('refined-theme.css')
          css = theme.read_text()
          start = css.find('/* Operators remain explanatory, not decorative. */')
          end = css.find('\n\n/* Crisp geometry, not rounded SaaS styling. */', start)
          if start < 0 or end < 0:
              raise SystemExit('Could not locate the current operator theme block.')

          operator_block = r'''/* Restore the approved equation semantics: green + signs and a true green/blue hybrid =. */
          .equation-op.plus{
            color:var(--actual-primary)!important;
            border-color:var(--actual-border)!important;
            background:var(--bg)!important;
            box-shadow:none!important;
          }
          .equation-op.equal{
            color:transparent!important;
            font-size:0!important;
            border:1px solid transparent!important;
            background:
              linear-gradient(var(--bg),var(--bg)) padding-box,
              linear-gradient(90deg,var(--actual-primary),var(--forecast-primary)) border-box!important;
            box-shadow:none!important;
          }
          .equation-op.equal::after{
            content:'=';
            font-family:'IBM Plex Mono',monospace;
            font-size:14px;
            font-weight:600;
            line-height:1;
            background:linear-gradient(90deg,var(--actual-primary),var(--forecast-primary))!important;
            -webkit-background-clip:text!important;
            background-clip:text!important;
            -webkit-text-fill-color:transparent!important;
            color:transparent!important;
          }
          .payoff-equation-operator .equation-op.equal::after{font-size:17px!important;}

          /* Keep the modeled-return forecast segment at the original bright forecast blue. */
          .tr-predicted{
            background:repeating-linear-gradient(135deg,#38BDF8,#38BDF8 2px,rgba(56,189,248,.35) 2px,rgba(56,189,248,.35) 4px)!important;
          }'''

          css = css[:start] + operator_block + css[end:]
          theme.write_text(css)
          PY

      - name: Validate JavaScript and snapshot
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv, io, re

          html = Path('index.html').read_text()
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S)
          inline = '\n'.join(scripts)
          Path('/tmp/open-book-inline.js').write_text(inline)

          rows = list(csv.DictReader(io.StringIO(Path('property-data.csv').read_text(encoding='utf-8-sig'))))
          if len(rows) < 1:
              raise SystemExit('Snapshot validation found zero rows')
          print(f'Snapshot rows: {len(rows)}')
          PY
          node --check /tmp/open-book-inline.js
          grep -q 'PROPERTY_DATA_SNAPSHOT_URL = "property-data.csv"' index.html
          if grep -q 'async function fetchSheetCsv' index.html; then
            echo 'Old live Google fetch path is still present.'
            exit 1
          fi
          if grep -q 'papaparse.min.js' index.html; then
            echo 'External Papa Parse dependency is still present.'
            exit 1
          fi

      - name: Browser smoke test with Google blocked
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          python3 -m http.server 8000 >/tmp/open-book-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage();
            const errors = [];
            const googleRequests = [];
            page.on('pageerror', err => errors.push(String(err)));
            page.on('request', req => { if(req.url().includes('docs.google.com')) googleRequests.push(req.url()); });
            await page.route('**docs.google.com/**', route => route.abort());
            await page.goto('http://127.0.0.1:8000/', {waitUntil:'domcontentloaded', timeout:30000});
            await page.waitForSelector('#tableBody tr.data-row', {timeout:15000});
            const count = await page.locator('#tableBody tr.data-row').count();
            if(count < 1) throw new Error('Property table rendered zero rows.');
            if(googleRequests.length) throw new Error('The page still requested Google Sheets directly.');
            if(errors.length) throw new Error(`Browser page errors: ${errors.join(' | ')}`);

            const equalStyle = await page.evaluate(() => {
              const el = document.querySelector('.payoff-equation-operator .equation-op.equal');
              const base = getComputedStyle(el);
              const pseudo = getComputedStyle(el, '::after');
              return {base:bg(base.backgroundImage), pseudo:bg(pseudo.backgroundImage)};
              function bg(v){ return String(v || ''); }
            });
            if(!equalStyle.base.includes('gradient') || !equalStyle.pseudo.includes('gradient')){
              throw new Error(`Hybrid equals styling missing: ${JSON.stringify(equalStyle)}`);
            }

            const blueBar = await page.locator('.tr-predicted').first().evaluate(el => getComputedStyle(el).backgroundImage);
            if(!blueBar.includes('56, 189, 248')){
              throw new Error(`Modeled-return blue segment is not restored: ${blueBar}`);
            }
            console.log('Rendered property rows:', count);
            console.log('Hybrid equals:', equalStyle);
            console.log('Modeled forecast bar:', blueBar);
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          JS

      - name: Commit stabilized site
        run: |
          git config user.name 'Open Book updater'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html refined-theme.css property-data.csv
          if git diff --cached --quiet; then
            echo 'No site changes needed.'
            exit 0
          fi
          git commit -m 'Stabilize property loading and restore return visuals'
          git pull --rebase origin main
          git push origin HEAD:main
