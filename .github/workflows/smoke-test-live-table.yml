name: Smoke test live property table

on:
  push:
    paths:
      - '.github/workflows/smoke-test-live-table.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for GitHub Pages deployment to settle
        run: sleep 45

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Test table load and property return flow
        run: |
          node <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage();
            const errors = [];
            page.on('pageerror', err => { errors.push(String(err)); console.error('PAGE ERROR:', err); });
            page.on('console', msg => {
              if(msg.type() === 'error') console.error('CONSOLE ERROR:', msg.text());
            });

            await page.goto('https://shlomgo.github.io/portfolio-web-page/', {waitUntil:'domcontentloaded', timeout:30000});
            await page.waitForSelector('#tableBody tr.data-row', {timeout:25000});
            const initialCount = await page.locator('#tableBody tr.data-row').count();
            if(initialCount < 1) throw new Error('Property table rendered zero rows.');
            console.log('Initial property rows:', initialCount);

            const propertyLink = page.locator('#tableBody tr.data-row .property-page-link').first();
            if(await propertyLink.count() < 1) throw new Error('No property-page link was available for navigation test.');
            await propertyLink.click();
            await page.waitForSelector('a.back', {timeout:15000});
            if(!page.url().includes('from=openbook')) throw new Error('Property link did not carry the Open Book return marker.');

            await page.locator('a.back').click();
            await page.waitForSelector('#tableBody tr.data-row', {timeout:25000});
            const returnCount = await page.locator('#tableBody tr.data-row').count();
            if(returnCount < 1) throw new Error('Property table did not survive return navigation.');
            console.log('Rows after return:', returnCount);

            const markerFill = await page.locator('#payoffArrowHybrid path').getAttribute('fill');
            console.log('Modeled arrow fill:', markerFill);
            if(markerFill === '#43d8c9') throw new Error('Old cyan modeled-return arrow is still present.');

            if(errors.length) throw new Error(`Browser reported ${errors.length} page error(s): ${errors.join(' | ')}`);
            await browser.close();
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          JS
