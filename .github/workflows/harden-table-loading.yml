name: Harden table loading and info popups

on:
  push:
    paths:
      - '.github/workflows/harden-table-loading.yml'

permissions:
  contents: write

jobs:
  patch-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply resilience patch
        run: python3 .github/scripts/harden_table.py
      - name: Check JavaScript syntax
        run: |
          python3 -c "import re,pathlib; s=pathlib.Path('index.html').read_text(); x=[v for v in re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',s,re.S) if v.strip()][-1]; pathlib.Path('/tmp/site.js').write_text(x)"
          node --check /tmp/site.js
      - name: Commit patch
        run: |
          rm .github/workflows/harden-table-loading.yml .github/scripts/harden_table.py
          git config user.name "Open Book updater"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/harden-table-loading.yml .github/scripts/harden_table.py
          git commit -m "Harden property loading and info popups"
          git push origin HEAD:main
