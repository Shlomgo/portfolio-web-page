name: Diagnose render regression

on:
  push:
    paths:
      - '.github/workflows/fix-render-regression.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check inline JavaScript syntax
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text()
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', s, flags=re.S)
          inline = [x for x in scripts if x.strip()]
          if not inline:
              raise SystemExit('No inline script found')
          Path('/tmp/site.js').write_text(inline[-1])
          print(f'Extracted {len(inline[-1].splitlines())} lines of inline JS')
          PY
          node --check /tmp/site.js
