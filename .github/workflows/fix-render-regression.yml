name: Diagnose render regression

on:
  push:
    paths:
      - '.github/workflows/fix-render-regression.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run page in headless Chrome
        shell: bash
        run: |
          set -u
          python3 -m http.server 8000 >/tmp/server.log 2>&1 &
          SERVER_PID=$!
          sleep 2

          CHROME=""
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then CHROME="$candidate"; break; fi
          done
          if [ -z "$CHROME" ]; then
            echo "No Chrome/Chromium binary found"
            exit 1
          fi
          echo "Using browser: $CHROME"

          set +e
          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --virtual-time-budget=12000 \
            --enable-logging=stderr \
            --v=0 \
            --dump-dom http://127.0.0.1:8000/index.html \
            >/tmp/dom.html 2>/tmp/chrome.log
          CHROME_EXIT=$?
          set -e

          kill "$SERVER_PID" 2>/dev/null || true
          echo "Chrome exit: $CHROME_EXIT"
          echo "--- console / browser errors ---"
          grep -Ei "Uncaught|ReferenceError|TypeError|SyntaxError|SEVERE|Papa|Could not load|error" /tmp/chrome.log || true
          echo "--- rendered page signals ---"
          python3 - <<'PY'
          from pathlib import Path
          dom = Path('/tmp/dom.html').read_text(errors='ignore')
          print('data rows:', dom.count('class="data-row'))
          print('mobile cards:', dom.count('class="mp-card'))
          for needle in ['Showing ', 'Could not load data from the Google Sheet', 'Recommended + Available']:
              print(needle, '=>', needle in dom)
          idx = dom.find('countNote')
          if idx >= 0:
              print('countNote context:', dom[max(0,idx-250):idx+500])
          PY
          echo "--- server log ---"
          cat /tmp/server.log || true
