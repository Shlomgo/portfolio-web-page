name: Diagnose render regression

on:
  push:
    paths:
      - '.github/workflows/fix-render-regression.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify table and info popup behavior
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          probe = r'''<script>
          setTimeout(() => {
            const dot = document.querySelector('.column-header-row .info-dot');
            if (dot) {
              dot.click();
              const tip = dot.querySelector('.tip');
              document.body.dataset.headerInfoOpen = String(dot.classList.contains('open'));
              if (tip) {
                const cs = getComputedStyle(tip);
                const r = tip.getBoundingClientRect();
                document.body.dataset.headerTipVisibility = cs.visibility;
                document.body.dataset.headerTipOpacity = cs.opacity;
                document.body.dataset.headerTipRect = [Math.round(r.left),Math.round(r.top),Math.round(r.right),Math.round(r.bottom)].join(',');
              }
            }
            const comparison = document.querySelector('.comparison-info');
            if (comparison) {
              comparison.click();
              const tip = comparison.querySelector('.tip');
              document.body.dataset.comparisonInfoOpen = String(comparison.classList.contains('open'));
              if (tip) {
                const cs = getComputedStyle(tip);
                document.body.dataset.comparisonTipVisibility = cs.visibility;
                document.body.dataset.comparisonTipOpacity = cs.opacity;
              }
            }
          }, 7000);
          </script>'''
          s = s.replace('</body>', probe + '\n</body>')
          p.write_text(s)
          PY

          python3 -m http.server 8000 >/tmp/server.log 2>&1 &
          SERVER_PID=$!
          sleep 2
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=15000 --dump-dom http://127.0.0.1:8000/index.html >/tmp/dom.html 2>/tmp/chrome.log || true
          kill "$SERVER_PID" 2>/dev/null || true

          python3 - <<'PY'
          from pathlib import Path
          import re
          dom = Path('/tmp/dom.html').read_text(errors='ignore')
          print('data rows:', dom.count('class="data-row'))
          body = re.search(r'<body([^>]*)>', dom)
          attrs = body.group(1) if body else ''
          print('body diagnostic attrs:', attrs)
          for key in ['data-header-info-open="true"','data-header-tip-visibility="visible"','data-header-tip-opacity="1"','data-comparison-info-open="true"','data-comparison-tip-visibility="visible"','data-comparison-tip-opacity="1"']:
              print(key, '=>', key in dom)
          PY
