name: Fix property back navigation

on:
  push:
    paths:
      - '.github/workflows/fix-property-back-navigation.yml'

permissions:
  contents: write

jobs:
  fix-back-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make property-page back links return to the loaded table
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          helper = '''<script id="open-book-back-navigation">
          function openBookBack(event){
            try{
              const destination = new URL('../../', window.location.href);
              const referrer = document.referrer ? new URL(document.referrer) : null;
              const cameFromOpenBook = referrer &&
                referrer.origin === destination.origin &&
                referrer.pathname.replace(/\\\/+$/, '/') === destination.pathname.replace(/\\\/+$/, '/');

              if(cameFromOpenBook && window.history.length > 1){
                event.preventDefault();
                window.history.back();
                return false;
              }
            } catch(_err){}
            return true;
          }
          </script>'''

          changed = []
          for p in Path('properties').glob('*/index.html'):
              s = p.read_text()
              original = s

              s = re.sub(
                  r'<a\s+class="back"\s+href="\.\./\.\./"(?:\s+onclick="[^"]*")?>',
                  '<a class="back" href="../../" onclick="return openBookBack(event)">',
                  s,
                  count=1
              )

              s = re.sub(r'\n?<script id="open-book-back-navigation">.*?</script>', '', s, flags=re.S)
              if '</body>' in s:
                  s = s.replace('</body>', helper + '\n</body>', 1)

              if s != original:
                  p.write_text(s)
                  changed.append(str(p))

          if not changed:
              raise SystemExit('No property pages were updated.')
          print('Updated:', ', '.join(changed))
          PY

      - name: Verify back-navigation fix
        run: |
          grep -R -q 'onclick="return openBookBack(event)"' properties/*/index.html
          grep -R -q 'function openBookBack' properties/*/index.html

      - name: Commit back-navigation fix
        run: |
          git config user.name 'Open Book updater'
          git config user.email 'actions@users.noreply.github.com'
          git add properties/*/index.html
          if git diff --cached --quiet; then
            echo 'No property-page changes needed.'
            exit 0
          fi
          git commit -m 'Fix return from property pages to loaded table'
          git push
