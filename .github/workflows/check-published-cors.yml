name: One-time Open Book published CSV accessibility check
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-published-cors.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Open Book JavaScript syntax
        run: |
          node - <<'JS'
          const fs = require('fs');
          const vm = require('vm');
          const html = fs.readFileSync('open-book.html', 'utf8');
          const start = html.indexOf('<script>');
          const end = html.indexOf('</script>', start);
          if (start < 0 || end < 0) throw new Error('No inline Open Book script found');
          new vm.Script(html.slice(start + '<script>'.length, end), {filename:'open-book.html'});
          new vm.Script(fs.readFileSync('property-flow.js','utf8'), {filename:'property-flow.js'});
          if (!html.includes('fetchPublishedSheet()')) throw new Error('Google refresh missing');
          if (!html.includes('openbook:data-refreshed')) throw new Error('Refresh state hook missing');
          console.log('Passed: Open Book inline JS and property-flow.js parse correctly');
          JS
      - name: Check browser CORS headers on published Google Sheet
        run: |
          python - <<'PY'
          import re, pathlib, urllib.request
          from urllib.parse import urlparse
          html=pathlib.Path('open-book.html').read_text()
          url=re.search(r'const SHEET_CSV_URL = "([^"]+)"',html).group(1)
          for method in ['GET','HEAD']:
            req=urllib.request.Request(url,method=method,headers={
              'Origin':'https://shlomgo.github.io',
              'User-Agent':'Mozilla/5.0',
            })
            try:
              with urllib.request.urlopen(req,timeout=25) as res:
                print('Method',method,'Status',res.status,'Final domain',urlparse(res.url).hostname)
                print('CORS allow origin',res.headers.get('Access-Control-Allow-Origin'))
                print('Content type',res.headers.get('Content-Type'))
                print('Bytes',len(res.read()) if method=='GET' else 'HEAD')
            except Exception as e: print(method,'failed:',repr(e))
          PY
