name: One-time single status rail fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Make status rail a single grooved frame
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          css = Path('refined-theme.css')
          c = css.read_text()

          c = c.replace('tbody tr.data-row.status-proposed-row td:first-child{box-shadow:inset 2px 0 0 var(--brand-accent)!important;}\n', '')

          pattern = r"tbody tr\.data-row > td:first-child::after\{.*?\}\n"
          replacement = "tbody tr.data-row > td:first-child::after{\n  content:none!important;\n}\n"
          c, count = re.subn(pattern, replacement, c, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Expected status rail after-layer not found')

          c = c.replace('inset 1px 0 0 rgba(255,255,255,.14),\n    inset -1px 0 0 rgba(0,0,0,.34),\n    1px 0 0 rgba(255,255,255,.03);', 'inset 1px 0 0 rgba(255,255,255,.16),\n    inset -1px 0 0 rgba(0,0,0,.38),\n    1px 0 0 rgba(255,255,255,.025);', 1)
          css.write_text(c)

          index = Path('index.html')
          s = index.read_text()
          if 'refined-theme.css?v=20260904-3' not in s:
              raise SystemExit('Expected stylesheet cache key not found')
          index.write_text(s.replace('refined-theme.css?v=20260904-3', 'refined-theme.css?v=20260904-4', 1))
          PY

      - name: Commit single rail fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html refined-theme.css
          git diff --cached --quiet && exit 0
          git commit -m "Use single grooved status rail"
          git push origin HEAD:main
