name: Apply payoff equation layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-payoff-equation-layout.yml'

permissions:
  contents: write

jobs:
  patch-main-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply approved payoff layout
        run: python .github/payoff_patch.py
      - name: Commit approved layout
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html changes to commit."
            exit 0
          fi
          git config user.name "Open Book UI update"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Implement approved payoff equation layout"
          git push origin main
