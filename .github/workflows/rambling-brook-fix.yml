name: Rambling Brook media and schools fix

on:
  push:
    branches:
      - rambling-brook-media-schools-fix
    paths:
      - '.rambling-brook-fix/READY'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Rambling Brook page
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('properties/1649-rambling-brook-drive/index.html')
          s = p.read_text()

          extra_css = r'''
<style>
/* Rambling Brook page refinements: one lot-map poster, clear video play state, and school cards. */
.walkthrough-figure{grid-column:2;}
.video-shell{position:relative;background:#000;min-height:240px;display:flex;align-items:center;justify-content:center;}
.video-shell video{width:100%;display:block;aspect-ratio:16/9;object-fit:contain;background:#000;}
.video-play{position:absolute;inset:50% auto auto 50%;transform:translate(-50%,-50%);border:1px solid rgba(255,255,255,.55);background:rgba(11,12,16,.86);color:var(--text);padding:12px 18px;border-radius:999px;font:12px 'IBM Plex Mono',monospace;cursor:pointer;box-shadow:0 8px 28px rgba(0,0,0,.35);}
.video-play:hover{border-color:var(--green);color:var(--green);}
.video-direct{color:var(--green);text-decoration:none;border-bottom:1px solid var(--green-dim);}
.school-source{font:11px 'IBM Plex Mono',monospace;color:var(--muted);margin:-2px 0 14px;}
.school-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;}
.school-card{border:1px solid var(--border);border-radius:4px;background:var(--surface);padding:18px;min-height:210px;}
.school-top{display:flex;gap:14px;align-items:center;margin-bottom:16px;}
.school-rating{width:58px;height:58px;border-radius:50%;background:#0d5d52;display:flex;align-items:center;justify-content:center;flex:0 0 58px;font:700 17px 'IBM Plex Mono',monospace;color:#fff;}
.school-rating span{font-size:11px;font-weight:500;margin-left:1px;}
.school-name{font-size:16px;line-height:1.25;margin:0 0 4px;}
.school-meta{font:11px 'IBM Plex Mono',monospace;color:var(--muted);}
.school-metric{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-top:1px solid var(--border);font-size:13px;}
.school-metric b{font-family:'IBM Plex Mono',monospace;font-size:12px;white-space:nowrap;}
.school-note{font-size:12px;color:var(--muted);margin-top:12px;max-width:900px;}
@media(max-width:860px){.school-grid{grid-template-columns:1fr;}.walkthrough-figure{grid-column:1;}.video-shell{min-height:0;}}
</style>
'''
          if '.school-grid{' not in s:
              s = s.replace('</head>', extra_css + '</head>', 1)

          replacement = r'''  <section>
    <div class="section-label">Nearby schools</div>
    <div class="school-source">Source: GreatSchools®</div>
    <div class="school-grid">
      <article class="school-card">
        <div class="school-top"><div class="school-rating">8<span>/10</span></div><div><h3 class="school-name">Hurricane Creek Elementary School</h3><div class="school-meta">Grades K–5 · 1 mile</div></div></div>
        <div class="school-metric"><span>Test Score Rating</span><b>7/10</b></div>
        <div class="school-metric"><span>Student Progress Rating</span><b>8/10</b></div>
      </article>
      <article class="school-card">
        <div class="school-top"><div class="school-rating">7<span>/10</span></div><div><h3 class="school-name">Bryant Junior High School</h3><div class="school-meta">Grades 8–9 · 3.2 miles</div></div></div>
        <div class="school-metric"><span>Test Score Rating</span><b>9/10</b></div>
        <div class="school-metric"><span>Student Progress Rating</span><b>4/10</b></div>
      </article>
      <article class="school-card">
        <div class="school-top"><div class="school-rating">5<span>/10</span></div><div><h3 class="school-name">Bryant High School</h3><div class="school-meta">Grades 9–12 · 3.5 miles</div></div></div>
        <div class="school-metric"><span>Test Score Rating</span><b>3/10</b></div>
        <div class="school-metric"><span>College Readiness Rating</span><b>10/10</b></div>
        <div class="school-metric"><span>Student Progress Rating</span><b>3/10</b></div>
      </article>
    </div>
    <p class="school-note">Ratings and distances reproduced from the GreatSchools information in the supplied listing screenshot. Ratings and attendance assignments can change; verify current zoning directly with the school district.</p>
  </section>

  <section><div class="section-label">See it for yourself</div><div class="media-grid">
    <figure class="walkthrough-figure"><div class="video-shell"><video controls playsinline preload="metadata" poster="images/1649-rambling-brook-lot.jpg"><source src="video/1649-rambling-brook-lot-walkthrough.mp4" type="video/mp4">Your browser doesn't support embedded video.</video><button class="video-play" type="button" aria-label="Play lot walkthrough">▶ Play lot walkthrough</button></div><figcaption>Lot 388 walkthrough — pre-construction · <a class="video-direct" href="video/1649-rambling-brook-lot-walkthrough.mp4" target="_blank" rel="noopener">open video directly ↗</a></figcaption></figure>
    <figure class="full-span"><img src="images/1649-rambling-brook-floorplan.png" alt="Floor plan for lot 388"><figcaption>Floor plan — lot 388</figcaption></figure>
  </div><div class="link-row"><a href="https://maps.app.goo.gl/Sra1vJtUEDiw768a6?g_st=aw" target="_blank" rel="noopener">Location pin ↗</a><a href="https://www.lennar.com/new-homes/arkansas/little-rock/benton/cottage-walk" target="_blank" rel="noopener">Cottage Walk community page ↗</a></div></section>'''

          pattern = r'  <section><div class="section-label">See it for yourself</div><div class="media-grid">.*?</section>'
          if 'Nearby schools' not in s:
              s, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit('Could not locate the See it for yourself section')
          else:
              # If rerun, at least ensure the old duplicate standalone lot image is absent.
              s = re.sub(r'\s*<figure><img src="images/1649-rambling-brook-lot\.jpg"[^>]*><figcaption>Lot 388 — pre-construction</figcaption></figure>', '', s, count=1)

          video_script = r'''
<script>
  document.querySelectorAll('.video-shell').forEach(shell => {
    const video = shell.querySelector('video');
    const button = shell.querySelector('.video-play');
    if(!video || !button) return;
    button.addEventListener('click', () => video.play());
    video.addEventListener('play', () => { button.hidden = true; });
    video.addEventListener('pause', () => { if(!video.ended) button.hidden = false; });
    video.addEventListener('ended', () => { button.hidden = false; });
  });
</script>
'''
          if "querySelectorAll('.video-shell')" not in s:
              s = s.replace('<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>', video_script + '<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>', 1)

          p.write_text(s)
          PY

      - name: Validate page changes
        shell: bash
        run: |
          PAGE='properties/1649-rambling-brook-drive/index.html'
          grep -q 'Nearby schools' "$PAGE"
          grep -q 'Hurricane Creek Elementary School' "$PAGE"
          grep -q 'Bryant Junior High School' "$PAGE"
          grep -q 'Bryant High School' "$PAGE"
          grep -q 'Play lot walkthrough' "$PAGE"
          test "$(grep -o 'images/1649-rambling-brook-lot.jpg' "$PAGE" | wc -l)" -eq 1

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          rm -rf .rambling-brook-fix
          rm -f .github/workflows/rambling-brook-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Rambling Brook media and add school ratings'
          git push origin HEAD:rambling-brook-media-schools-fix
