name: Apply explainer polish v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-explainer-polish-v3.yml'

permissions:
  contents: write

jobs:
  patch-main-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply approved explainer polish
        run: python .github/explainer_polish_v3.py
      - name: Commit approved explainer polish
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html changes to commit."
            exit 0
          fi
          git config user.name "Open Book UI update"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Polish return explainer copy and arrow mapping"
          git push origin main
