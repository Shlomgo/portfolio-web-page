name: Property pages one-time setup

on:
  push:
    branches:
      - property-pages-setup
    paths:
      - '.property-upload/READY'

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch portfolio page
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()

          # Read a permanent, human-readable URL slug from the Google Sheet.
          anchor = '    status: normalizeStatus(row["Status"]),\n    price,'
          replacement = '    status: normalizeStatus(row["Status"]),\n    pageSlug: String(row["Property Page Slug"]||"").trim(),\n    price,'
          if 'pageSlug: String(row["Property Page Slug"]' not in s:
              if anchor not in s:
                  raise SystemExit('Could not find rowToRecord insertion point')
              s = s.replace(anchor, replacement, 1)

          # Add one reusable link helper. Any row with a slug keeps its link even
          # if the status later changes from Proposed to Under Contract or Closed.
          helper_anchor = '''function operatingLabel(d){
            return d.status === "closed" ? "actual" : "underwritten";
          }'''.replace('          ', '')
          helper = '''function operatingLabel(d){
            return d.status === "closed" ? "actual" : "underwritten";
          }

          function propertyPageHref(d){
            if(!d.pageSlug) return "";
            return `properties/${encodeURIComponent(d.pageSlug)}/`;
          }

          function propertyPageLinkHTML(d, mobile=false){
            const href = propertyPageHref(d);
            if(!href) return "";
            const cls = mobile ? "mp-property-page-link" : "property-page-link";
            return `<a class="${cls}" href="${href}" onclick="event.stopPropagation()">View property →</a>`;
          }'''.replace('          ', '')
          if 'function propertyPageHref(d)' not in s:
              if helper_anchor not in s:
                  raise SystemExit('Could not find operatingLabel insertion point')
              s = s.replace(helper_anchor, helper, 1)

          desktop_anchor = '      <td><span class="status-badge status-${d.status}">${STATUS_LABEL[d.status]}</span></td>'
          desktop_replacement = '      <td class="status-cell"><span class="status-badge status-${d.status}">${STATUS_LABEL[d.status]}</span>${propertyPageLinkHTML(d)}</td>'
          if '${propertyPageLinkHTML(d)}</td>' not in s:
              if desktop_anchor not in s:
                  raise SystemExit('Could not find desktop status cell')
              s = s.replace(desktop_anchor, desktop_replacement, 1)

          mobile_anchor = '      <div class="mp-row2">${fmt$(d.price)} purchase · ${fmt$(d.invested)} invested</div>'
          mobile_replacement = mobile_anchor + '\n      ${propertyPageLinkHTML(d,true)}'
          if '${propertyPageLinkHTML(d,true)}' not in s:
              if mobile_anchor not in s:
                  raise SystemExit('Could not find mobile property-card insertion point')
              s = s.replace(mobile_anchor, mobile_replacement, 1)

          css_anchor = '  .status-proposed{background:rgba(255,255,255,0.06);color:var(--paper-dim);border:1px solid var(--line);}\n'
          css_extra = '''  .property-page-link,
            .mp-property-page-link{
              color:var(--brass);
              font-family:'IBM Plex Mono',monospace;
              text-decoration:none;
              white-space:nowrap;
            }
            .property-page-link{display:block;width:max-content;margin-top:5px;font-size:9.5px;line-height:1.25;}
            .mp-property-page-link{display:inline-block;margin:5px 0 2px;font-size:11px;}
            .property-page-link:hover,.mp-property-page-link:hover{text-decoration:underline;color:#d6c19e;}
          '''.replace('          ', '')
          if '.property-page-link,' not in s:
              if css_anchor not in s:
                  raise SystemExit('Could not find status CSS insertion point')
              s = s.replace(css_anchor, css_anchor + css_extra, 1)

          p.write_text(s)
          PY

      - name: Validate portfolio changes
        shell: bash
        run: |
          grep -q 'Property Page Slug' index.html
          grep -q 'propertyPageLinkHTML' index.html
          grep -q 'mp-property-page-link' index.html

      - name: Remove one-time setup files and commit result
        shell: bash
        run: |
          rm -rf .property-upload
          rm -f .github/workflows/property-pages-setup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Link portfolio rows to property detail pages'
          git push origin HEAD:property-pages-setup
