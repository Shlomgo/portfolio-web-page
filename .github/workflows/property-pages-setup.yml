name: Property pages one-time setup

on:
  push:
    branches:
      - property-pages-setup
    paths:
      - '.property-upload/READY'

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch portfolio page
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()

          # 1) Read the permanent property-page slug from each spreadsheet row.
          row_anchor = '''    state: String(row["State"]||"").trim(),
              status: normalizeStatus(row["Status"]),
              price,'''
          row_replacement = '''    state: String(row["State"]||"").trim(),
              status: normalizeStatus(row["Status"]),
              pageSlug: String(row["Property Page Slug"]||"").trim(),
              price,'''
          if 'pageSlug: String(row["Property Page Slug"]' not in s:
              if row_anchor not in s:
                  raise SystemExit('Could not find rowToRecord insertion point')
              s = s.replace(row_anchor, row_replacement, 1)

          # 2) Shared helper. A page stays linked if its status later changes from Proposed.
          helper_anchor = '''function operatingLabel(d){
            return d.status === "closed" ? "actual" : "underwritten";
          }
          '''
          helper = '''function operatingLabel(d){
            return d.status === "closed" ? "actual" : "underwritten";
          }

          function propertyPageHref(d){
            if(!d.pageSlug) return "";
            return `properties/${encodeURIComponent(d.pageSlug)}/`;
          }

          function propertyPageLinkHTML(d, mobile=false){
            const href = propertyPageHref(d);
            if(!href) return "";
            const cls = mobile ? "mp-property-page-link" : "property-page-link";
            return `<a class="${cls}" href="${href}" onclick="event.stopPropagation()">View property →</a>`;
          }
          '''
          if 'function propertyPageHref(d)' not in s:
              if helper_anchor not in s:
                  raise SystemExit('Could not find operatingLabel insertion point')
              s = s.replace(helper_anchor, helper, 1)

          # 3) Desktop link lives under the status badge, so no extra table column is needed.
          desktop_anchor = '''      <td><span class="status-badge status-${d.status}">${STATUS_LABEL[d.status]}</span></td>'''
          desktop_replacement = '''      <td class="status-cell"><span class="status-badge status-${d.status}">${STATUS_LABEL[d.status]}</span>${propertyPageLinkHTML(d)}</td>'''
          if '${propertyPageLinkHTML(d)}</td>' not in s:
              if desktop_anchor not in s:
                  raise SystemExit('Could not find desktop status cell')
              s = s.replace(desktop_anchor, desktop_replacement, 1)

          # 4) Mobile card gets the same link immediately below price/invested.
          mobile_anchor = '''      <div class="mp-row2">${fmt$(d.price)} purchase · ${fmt$(d.invested)} invested</div>
                <div class="mp-metrics">'''
          mobile_replacement = '''      <div class="mp-row2">${fmt$(d.price)} purchase · ${fmt$(d.invested)} invested</div>
                ${propertyPageLinkHTML(d,true)}
                <div class="mp-metrics">'''
          if '${propertyPageLinkHTML(d,true)}' not in s:
              if mobile_anchor not in s:
                  raise SystemExit('Could not find mobile property-card insertion point')
              s = s.replace(mobile_anchor, mobile_replacement, 1)

          # 5) Styling for desktop and mobile links.
          css_anchor = '''  .status-proposed{background:rgba(255,255,255,0.06);color:var(--paper-dim);border:1px solid var(--line);}
          '''
          css = '''  .status-proposed{background:rgba(255,255,255,0.06);color:var(--paper-dim);border:1px solid var(--line);}
            .property-page-link,
            .mp-property-page-link{
              color:var(--brass);
              font-family:'IBM Plex Mono',monospace;
              text-decoration:none;
              white-space:nowrap;
            }
            .property-page-link{display:block;width:max-content;margin-top:5px;font-size:9.5px;line-height:1.25;}
            .mp-property-page-link{display:inline-block;margin:5px 0 2px;font-size:11px;}
            .property-page-link:hover,.mp-property-page-link:hover{text-decoration:underline;color:#d6c19e;}
          '''
          if '.property-page-link,' not in s:
              if css_anchor not in s:
                  raise SystemExit('Could not find status CSS insertion point')
              s = s.replace(css_anchor, css, 1)

          p.write_text(s)
          PY

      - name: Restore property media
        shell: bash
        run: |
          cat .property-upload/media.b64.part* | base64 --decode > /tmp/property-media.tar.gz
          echo '25de2a71e03065151203332d6b1844e54ff81f8ea43f93c1ac793c038dd53eac  /tmp/property-media.tar.gz' | sha256sum -c -
          tar -xzf /tmp/property-media.tar.gz -C .

      - name: Validate generated files
        shell: bash
        run: |
          test -f properties/1649-rambling-brook-drive/images/1649-rambling-brook-street-view.jpg
          test -f properties/1649-rambling-brook-drive/images/1649-rambling-brook-floorplan.png
          test -f properties/1649-rambling-brook-drive/images/1649-rambling-brook-lot.jpg
          test -f properties/1649-rambling-brook-drive/video/1649-rambling-brook-lot-walkthrough.mp4
          grep -q 'Property Page Slug' index.html
          grep -q 'propertyPageLinkHTML' index.html

      - name: Remove one-time upload machinery and commit result
        shell: bash
        run: |
          rm -rf .property-upload
          rm -f .github/workflows/property-pages-setup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add reusable property pages and Rambling Brook detail page'
          git push origin HEAD:property-pages-setup
