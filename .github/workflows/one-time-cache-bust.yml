name: One-time stylesheet cache bust

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cache-bust:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update refined-theme cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = 'refined-theme.css?v=20260904-1'
          new = 'refined-theme.css?v=20260904-2'
          if old not in s:
              raise SystemExit('Expected stylesheet reference not found; refusing to modify index.html')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit cache-busting reference
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Bust refined theme cache"
          git push origin HEAD:main
