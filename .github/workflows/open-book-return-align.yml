name: One-time Open Book return alignment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/open-book-return-align.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align explainer to table columns
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          s = path.read_text()
          old = """    grid-template-columns:\n      minmax(24px,1fr) minmax(52px,1fr) minmax(128px,1fr) minmax(124px,1fr)\n      minmax(86px,1fr) minmax(90px,1fr) minmax(146px,1fr) minmax(114px,1fr)\n      minmax(114px,1fr) minmax(110px,1fr) minmax(140px,1fr) minmax(154px,1fr);\n    grid-template-rows:auto 78px;\n"""
          new = """    grid-template-columns:24px 52px 128px 124px 86px 90px 146px 114px 114px 110px 140px 154px;\n    justify-content:space-between;\n    grid-template-rows:auto 78px;\n"""
          if s.count(old) != 1:
              raise SystemExit(f'Expected one explainer-grid marker, found {s.count(old)}')
          path.write_text(s.replace(old, new, 1))
          PY
      - name: Commit alignment fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Align return explainer with table columns"
          git push
