name: Install property media

on:
  push:
    branches:
      - property-pages-deploy
    paths:
      - '.property-media/READY'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore media files
        shell: bash
        run: |
          cat .property-media/media.b64.part-* | base64 --decode > /tmp/property-media.tar.gz
          echo 'd1f6b0186c94dfd650508f5445ad48ea19e48124e89149c8d29e70826e6b9e43  /tmp/property-media.tar.gz' | sha256sum -c -
          tar -xzf /tmp/property-media.tar.gz -C .
          test -f properties/1649-rambling-brook-drive/images/1649-rambling-brook-street-view.jpg
          test -f properties/1649-rambling-brook-drive/images/1649-rambling-brook-floorplan.png
          test -f properties/1649-rambling-brook-drive/images/1649-rambling-brook-lot.jpg
          test -f properties/1649-rambling-brook-drive/video/1649-rambling-brook-lot-walkthrough.mp4

      - name: Clean staging files and commit
        shell: bash
        run: |
          rm -rf .property-media
          rm -f .github/workflows/install-property-media.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add Rambling Brook property media'
          git push origin HEAD:property-pages-deploy
