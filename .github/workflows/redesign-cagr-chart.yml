name: Redesign CAGR comparison chart

on:
  push:
    paths:
      - '.github/workflows/redesign-cagr-chart.yml'
      - '.github/scripts/redesign_cagr_chart.py'

permissions:
  contents: write

jobs:
  patch-chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply chart redesign
        run: python3 .github/scripts/redesign_cagr_chart.py

      - name: Check JavaScript syntax
        shell: bash
        run: |
          python3 -c "import re,pathlib; s=pathlib.Path('index.html').read_text(); x=[v for v in re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',s,re.S) if v.strip()][-1]; pathlib.Path('/tmp/site.js').write_text(x)"
          node --check /tmp/site.js

      - name: Commit chart redesign
        shell: bash
        run: |
          rm .github/workflows/redesign-cagr-chart.yml .github/scripts/redesign_cagr_chart.py
          git config user.name "Open Book updater"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/redesign-cagr-chart.yml .github/scripts/redesign_cagr_chart.py
          git commit -m "Clarify CAGR comparison chart"
          git push origin HEAD:main
