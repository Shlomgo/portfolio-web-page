name: Redesign CAGR comparison chart

on:
  push:
    paths:
      - '.github/workflows/redesign-cagr-chart.yml'

permissions:
  contents: write

jobs:
  patch-chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace comparison chart
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()

          start_marker = '  <section class="comparison-section">'
          end_marker = '  </section>'
          start = s.find(start_marker)
          if start < 0:
              raise SystemExit('comparison-section start not found')
          end = s.find(end_marker, start)
          if end < 0:
              raise SystemExit('comparison-section end not found')
          end += len(end_marker)

          replacement = r'''  <section class="comparison-section">
    <div class="comparison-title-row">
      <h2 class="comparison-title">Illustrative rental CAGR vs. S&amp;P 500</h2>
      <span class="info-dot comparison-info" tabindex="0">i<span class="tip"><span class="tip-heading">What this chart shows</span><span class="tip-paragraph">This is an illustrative comparison of <strong>compound annual growth rate (CAGR)</strong> over different holding periods.</span><span class="tip-paragraph"><strong>Blue solid line:</strong> the modeled rental-property strategy. It begins at the current modeled return level and declines over longer holding periods as leverage contributes less to percentage returns while investor equity grows.</span><span class="tip-paragraph"><strong>Gray dashed line:</strong> an illustrative 9% annual S&amp;P 500 total-return benchmark with dividends reinvested.</span><span class="tip-paragraph">CAGR answers: “What constant annual return would compound the starting investment to the ending value over this holding period?”</span><span class="tip-paragraph">Both sides assume returns are reinvested and compounded rather than spent.</span><span class="tip-paragraph">The 9% S&amp;P 500 figure is a benchmark for illustration, <strong>not a prediction</strong>. The rental line is also a model, not a guaranteed future return.</span><span class="tip-heading tip-heading-spaced">Why the rental percentage declines</span><span class="tip-paragraph">Early in a leveraged real-estate investment, a relatively small amount of investor cash controls a much larger asset. As the mortgage is paid down and equity grows, the same dollar change in property value represents a smaller percentage return on the investor's growing equity.</span><span class="tip-paragraph">That does not necessarily mean the property is performing worse. It means leverage is providing less of a percentage-return boost.</span></span></span>
    </div>
    <p class="comparison-sub">Annualized compound return by holding period. Blue is the modeled rental strategy; the gray dashed line is an illustrative 9% S&amp;P 500 total-return benchmark.</p>

    <div class="comparison-legend" aria-hidden="true">
      <span class="comparison-legend-item"><span class="comparison-legend-line rental"></span>Modeled rental CAGR</span>
      <span class="comparison-legend-item"><span class="comparison-legend-line benchmark"></span>S&amp;P 500 benchmark · 9%</span>
    </div>

    <div class="curve-wrap comparison-curve">
      <svg viewBox="0 0 760 315" width="100%" height="315" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="cagrChartTitle cagrChartDesc">
        <title id="cagrChartTitle">Illustrative modeled rental CAGR compared with a 9 percent S&amp;P 500 benchmark</title>
        <desc id="cagrChartDesc">The modeled rental CAGR declines from about 22 percent at the beginning of the illustration to about 12 percent over a 20 year holding period. A gray dashed S&amp;P 500 benchmark remains at 9 percent.</desc>

        <!-- horizontal grid -->
        <g stroke="#2b2f34" stroke-width="1">
          <line x1="78" y1="34" x2="724" y2="34"/>
          <line x1="78" y1="76" x2="724" y2="76"/>
          <line x1="78" y1="118" x2="724" y2="118"/>
          <line x1="78" y1="160" x2="724" y2="160"/>
          <line x1="78" y1="202" x2="724" y2="202"/>
          <line x1="78" y1="244" x2="724" y2="244"/>
        </g>

        <!-- axes -->
        <line x1="78" y1="34" x2="78" y2="244" stroke="#62666b" stroke-width="1"/>
        <line x1="78" y1="244" x2="724" y2="244" stroke="#62666b" stroke-width="1"/>

        <!-- y axis labels: linear 0–25% scale -->
        <g fill="#a8a6a0" font-family="IBM Plex Mono" font-size="10" text-anchor="end">
          <text x="66" y="38">25%</text>
          <text x="66" y="80">20%</text>
          <text x="66" y="122">15%</text>
          <text x="66" y="164">10%</text>
          <text x="66" y="206">5%</text>
          <text x="66" y="248">0%</text>
        </g>

        <!-- x axis ticks and labels -->
        <g stroke="#62666b" stroke-width="1">
          <line x1="78" y1="244" x2="78" y2="250"/>
          <line x1="214" y1="244" x2="214" y2="250"/>
          <line x1="384" y1="244" x2="384" y2="250"/>
          <line x1="554" y1="244" x2="554" y2="250"/>
          <line x1="724" y1="244" x2="724" y2="250"/>
        </g>
        <g fill="#a8a6a0" font-family="IBM Plex Mono" font-size="10" text-anchor="middle">
          <text x="78" y="266">1</text>
          <text x="214" y="266">5</text>
          <text x="384" y="266">10</text>
          <text x="554" y="266">15</text>
          <text x="724" y="266">20</text>
        </g>

        <!-- axis titles -->
        <text x="401" y="292" fill="#a8a6a0" font-family="IBM Plex Sans" font-size="11" text-anchor="middle">Holding period (years)</text>
        <text x="18" y="139" fill="#a8a6a0" font-family="IBM Plex Sans" font-size="11" text-anchor="middle" transform="rotate(-90 18 139)">Compound annual growth rate (CAGR)</text>

        <!-- S&P benchmark: neutral, because green elsewhere means actual operating data -->
        <line x1="78" y1="168.4" x2="724" y2="168.4" stroke="#a8a6a0" stroke-width="2" stroke-dasharray="7,6"/>
        <rect x="451" y="150" width="260" height="17" rx="2" fill="#14171c" opacity="0.94"/>
        <text x="704" y="162" fill="#c5c3bd" font-family="IBM Plex Mono" font-size="10" text-anchor="end">S&amp;P 500 BENCHMARK · 9%</text>

        <!-- rental model: blue = modeled / forecast -->
        <path d="M 78 59 C 180 86, 302 111, 420 126 C 530 139, 622 143, 724 143" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
        <circle cx="78" cy="59" r="4" fill="#38bdf8"/>
        <circle cx="724" cy="143" r="4" fill="#38bdf8"/>

        <!-- direct labels -->
        <rect x="91" y="42" width="187" height="34" rx="3" fill="#14171c" opacity="0.94"/>
        <text x="99" y="55" fill="#38bdf8" font-family="IBM Plex Mono" font-size="10">MODELED RENTAL CAGR</text>
        <text x="99" y="69" fill="#f5f4f0" font-family="IBM Plex Mono" font-size="11">22% at year 1</text>

        <rect x="568" y="118" width="143" height="35" rx="3" fill="#14171c" opacity="0.94"/>
        <text x="703" y="132" fill="#38bdf8" font-family="IBM Plex Mono" font-size="10" text-anchor="end">RENTAL MODEL</text>
        <text x="703" y="147" fill="#f5f4f0" font-family="IBM Plex Mono" font-size="11" text-anchor="end">≈12% at year 20</text>
      </svg>
      <div class="curve-caption">ILLUSTRATIVE ONLY · modeled rental CAGR versus a constant 9% S&amp;P 500 total-return benchmark · returns assumed reinvested</div>
    </div>
  </section>'''

          s = s[:start] + replacement + s[end:]

          css_marker = '/* ===== CAGR chart clarity redesign ===== */'
          if css_marker not in s:
              css = r'''

/* ===== CAGR chart clarity redesign ===== */
.comparison-legend{
  display:flex;
  flex-wrap:wrap;
  gap:10px 22px;
  margin:0 0 8px;
  color:var(--text-secondary);
  font-family:'IBM Plex Mono',monospace;
  font-size:10.5px;
}
.comparison-legend-item{
  display:inline-flex;
  align-items:center;
  gap:8px;
}
.comparison-legend-line{
  width:28px;
  height:0;
  border-top:3px solid #38bdf8;
}
.comparison-legend-line.benchmark{
  border-top:2px dashed #a8a6a0;
}
.comparison-curve svg{
  display:block;
  overflow:visible;
}
@media (max-width:640px){
  .comparison-legend{gap:7px 16px;font-size:10px;}
  .comparison-curve svg{min-width:620px;}
  .comparison-curve{overflow-x:auto;padding-bottom:4px;}
}
'''
              s = s.replace('</style>', css + '\n</style>', 1)

          p.write_text(s)
          PY

      - name: Validate page
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text()
          checks = [
            'MODELED RENTAL CAGR',
            'S&amp;P 500 BENCHMARK · 9%',
            'Holding period (years)',
            'Compound annual growth rate (CAGR)',
            'stroke="#a8a6a0" stroke-width="2" stroke-dasharray="7,6"',
          ]
          missing = [x for x in checks if x not in s]
          if missing:
              raise SystemExit('Missing chart elements: ' + repr(missing))
          print('Chart markup validation passed')
          PY

          python3 - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text()
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', s, flags=re.S)
          inline = [x for x in scripts if x.strip()]
          Path('/tmp/site.js').write_text(inline[-1])
          PY
          node --check /tmp/site.js

      - name: Commit chart redesign
        shell: bash
        run: |
          rm .github/workflows/redesign-cagr-chart.yml
          git config user.name "Open Book updater"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/redesign-cagr-chart.yml
          git commit -m "Clarify CAGR comparison chart"
          git push origin HEAD:main
