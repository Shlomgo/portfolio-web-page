name: Apply requested table layout refinements

on:
  push:
    paths:
      - '.github/workflows/apply-table-layout-fix.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()

          def replace_once(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              s = s.replace(old, new, 1)

          replace_once(
          '''  <div class="legend-row">
              <span class="legend-swatch"><span class="legend-dot actual"></span> Operating figures — actual for closed properties, underwritten for pipeline properties</span>
              <span class="legend-swatch"><span class="legend-dot predicted"></span> Forecast — appreciation assumption, not guaranteed</span>
              <span class="legend-swatch"><span class="fx-dot" aria-hidden="true">ƒx</span> Formula — hover or tap ƒx beside a calculated field</span>
            </div>
            <p class="click-hint">Click any blue Appreciation box in the table below to see exactly how that number breaks down for that property.</p>

          ''',
          '',
          'remove old legend and click hint')

          replace_once(
          '''  <p class="table-scroll-hint">Scroll horizontally to see all columns →</p>
          ''',
          '',
          'remove horizontal scroll hint')

          replace_once(
          '''              <div class="payoff-subtitle">3 real levers add up to the modeled return</div>
          ''',
          '''              <div class="payoff-subtitle">3 real levers add up to the modeled return</div>
              <div class="payoff-inline-legend">
                <span class="legend-swatch"><span class="legend-dot actual"></span> Operating figures — actual for closed properties, underwritten for pipeline properties</span>
                <span class="legend-swatch"><span class="legend-dot predicted"></span> Forecast — appreciation assumption, not guaranteed</span>
              </div>
          ''',
          'move operating/forecast legend under payoff subtitle')

          replace_once(
          '''              <span class="payoff-card-copy">Forecast — 3% ×<br>3.33× leverage</span>
          ''',
          '''              <span class="payoff-card-copy">Forecast — 3% annual ×<br>3.33× leverage</span>
          ''',
          'add annual to appreciation callout')

          marker = '\n</style>'
          if marker not in s:
              raise SystemExit('style closing marker not found')

          css = r'''

/* ===== 2026-09-04 requested payoff/table refinements ===== */
/* Put the operating/forecast key directly between the payoff subtitle and cards. */
thead .payoff-intro-row > th:first-child{grid-column:1 / 13;}
thead .payoff-intro-row > th:last-child{display:none;}
.payoff-inline-legend{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:5px 24px;
  margin-top:8px;
  max-width:100%;
  font-family:'IBM Plex Mono',monospace;
  font-size:10.5px;
  line-height:1.35;
  color:var(--text-secondary);
}
.payoff-inline-legend .legend-swatch{gap:7px;}
.payoff-inline-legend .legend-dot{width:9px;height:9px;}

/* Let each callout begin slightly left of its data column while keeping its arrow
   centered over the data below. The appreciation card is intentionally a little
   shorter on the right than the other three. */
.payoff-card{
  width:calc(100% - 1px);
  margin-left:-4px;
  margin-right:0;
}
.payoff-card .payoff-arrow{left:calc(50% + 5px);}
.payoff-card.appreciation{
  width:calc(100% - 10px);
}
.payoff-card.appreciation .payoff-arrow{left:calc(50% + 9px);}
.payoff-card.appreciation .payoff-op{right:-24px;}

/* Show the same + + = relationship on every desktop data row. */
tbody tr.data-row td.cash-return-col,
tbody tr.data-row td.principal-return-col,
tbody tr.data-row td.appreciation-col{position:relative;}
tbody tr.data-row td.cash-return-col::after,
tbody tr.data-row td.principal-return-col::after,
tbody tr.data-row td.appreciation-col::after{
  position:absolute;
  right:-8px;
  top:50%;
  transform:translateY(-50%);
  z-index:4;
  width:16px;
  height:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid var(--status-border);
  border-radius:50%;
  background:var(--bg);
  color:var(--text-secondary);
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;
  line-height:1;
  pointer-events:none;
}
tbody tr.data-row td.cash-return-col::after,
tbody tr.data-row td.principal-return-col::after{content:'+';}
tbody tr.data-row td.appreciation-col::after{content:'=';}
tbody tr.data-row td.principal-return-col,
tbody tr.data-row td.appreciation-col,
tbody tr.data-row td.modeled-return-col{padding-left:13px;}

/* Center the status treatment inside its column. */
tbody tr.data-row td.status-cell{text-align:center;}
tbody tr.data-row td.status-cell .property-page-link{
  margin-left:auto;
  margin-right:auto;
}

/* Property-page links use the same amber/gold as the Open Book mark. */
.property-page-link,
.mp-property-page-link{color:#E1B85F;}
.property-page-link:hover,
.mp-property-page-link:hover{color:#F0CF82;}
'''

          if '2026-09-04 requested payoff/table refinements' in s:
              raise SystemExit('refinement CSS already present')
          s = s.replace(marker, css + marker, 1)

          p.write_text(s)
          PY
      - name: Commit patched page
        shell: bash
        run: |
          git config user.name "Open Book site updater"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Refine payoff callouts and table operators"
          git push
