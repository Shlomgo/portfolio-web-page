name: Apply table layout refinements

on:
  push:
    paths:
      - '.github/workflows/apply-table-layout-fix.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: python .github/patch_table_layout.py
      - name: Commit patched page
        run: |
          git config user.name "Open Book site updater"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Refine payoff callouts and table operators"
          git push
