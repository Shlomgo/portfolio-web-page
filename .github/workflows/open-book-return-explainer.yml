name: One-time Open Book table update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/open-book-return-explainer.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          s = path.read_text()

          table_marker = """  .table-wrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:8px;}\n  table{width:100%;border-collapse:collapse;min-width:1290px;table-layout:fixed;}\n"""
          explainer_css = """  .table-wrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:8px;}\n  table{width:100%;border-collapse:collapse;min-width:1290px;table-layout:fixed;}\n\n  /* ---------- How real estate pays you ---------- */\n  .return-payoff-explainer{\n    width:100%;\n    min-width:1290px;\n    display:grid;\n    grid-template-columns:\n      minmax(24px,1fr) minmax(52px,1fr) minmax(128px,1fr) minmax(124px,1fr)\n      minmax(86px,1fr) minmax(90px,1fr) minmax(146px,1fr) minmax(114px,1fr)\n      minmax(114px,1fr) minmax(110px,1fr) minmax(140px,1fr) minmax(154px,1fr);\n    grid-template-rows:auto 78px;\n    row-gap:14px;\n    padding:0 0 17px;\n    margin:0 0 8px;\n    border-bottom:1px solid var(--line);\n  }\n  .payoff-copy{\n    grid-column:1 / 9;\n    grid-row:1;\n    align-self:start;\n    padding:0 5px;\n  }\n  .payoff-title{\n    font-family:'IBM Plex Sans',sans-serif;\n    font-size:15px;\n    line-height:1.25;\n    font-weight:600;\n    color:var(--paper);\n  }\n  .payoff-subtitle{\n    margin-top:2px;\n    font-family:'IBM Plex Sans',sans-serif;\n    font-size:12px;\n    line-height:1.3;\n    color:var(--paper-dim);\n  }\n  .payoff-card{\n    grid-row:2;\n    position:relative;\n    min-width:0;\n    min-height:78px;\n    margin:0 5px;\n    padding:8px 7px 9px;\n    border-radius:8px;\n    font-family:'IBM Plex Sans',sans-serif;\n    font-size:10.5px;\n    line-height:1.32;\n  }\n  .payoff-card.cash{\n    grid-column:9;\n    background:rgba(68,166,139,.12);\n    border:1px solid rgba(78,190,160,.38);\n  }\n  .payoff-card.principal{\n    grid-column:10;\n    background:rgba(68,166,139,.12);\n    border:1px solid rgba(78,190,160,.38);\n  }\n  .payoff-card.appreciation{\n    grid-column:11;\n    background:rgba(193,99,63,.09);\n    border:1px dashed rgba(210,126,69,.70);\n  }\n  .payoff-card.modeled{\n    grid-column:12;\n    background:rgba(182,144,90,.06);\n    border:1px solid rgba(182,144,90,.28);\n  }\n  .payoff-card-name{\n    display:block;\n    margin-bottom:2px;\n    font-size:10.5px;\n    line-height:1.25;\n    font-weight:500;\n  }\n  .payoff-card.cash .payoff-card-name,\n  .payoff-card.principal .payoff-card-name{color:#72cdb4;}\n  .payoff-card.appreciation .payoff-card-name{color:#dc8f50;font-style:italic;}\n  .payoff-card.modeled .payoff-card-name{color:var(--paper);}\n  .payoff-card-copy{color:#aeb6c0;}\n  .payoff-card.appreciation .payoff-card-copy{color:#c6a08a;}\n  .payoff-mini-bars{\n    display:inline-flex;\n    align-items:center;\n    gap:3px;\n    margin-right:4px;\n    vertical-align:1px;\n  }\n  .payoff-mini-bars i{display:block;width:6px;height:6px;border-radius:1px;}\n  .payoff-mini-bars .actual{background:#72cdb4;}\n  .payoff-mini-bars .forecast{background:#dc8f50;}\n  .payoff-op{\n    position:absolute;\n    right:-15px;\n    top:30px;\n    z-index:3;\n    width:20px;\n    height:20px;\n    border-radius:50%;\n    border:1px solid var(--line);\n    background:var(--ink);\n    color:#aeb6c0;\n    display:flex;\n    align-items:center;\n    justify-content:center;\n    font-family:'IBM Plex Mono',monospace;\n    font-size:12px;\n    line-height:1;\n  }\n  .payoff-arrow{\n    position:absolute;\n    left:50%;\n    bottom:-17px;\n    width:0;\n    height:0;\n    transform:translateX(-50%);\n    border-left:5px solid transparent;\n    border-right:5px solid transparent;\n    border-top:5px solid currentColor;\n  }\n  .payoff-card.cash .payoff-arrow,\n  .payoff-card.principal .payoff-arrow{color:#58bca3;}\n  .payoff-card.appreciation .payoff-arrow{color:#cf7940;}\n  .payoff-card.modeled .payoff-arrow{color:#8099ad;}\n"""
          if s.count(table_marker) != 1:
              raise SystemExit(f'Expected one table CSS marker, found {s.count(table_marker)}')
          s = s.replace(table_marker, explainer_css, 1)

          old_sort = """      <select id=\"sortSelect\">\n        <option value=\"date_asc\" selected>Closing date (oldest first)</option>\n        <option value=\"date_desc\">Closing date (newest first)</option>\n"""
          new_sort = """      <select id=\"sortSelect\">\n        <option value=\"date_desc\" selected>Closing date (newest first)</option>\n        <option value=\"date_asc\">Closing date (oldest first)</option>\n"""
          if s.count(old_sort) != 1:
              raise SystemExit(f'Expected one sort-select marker, found {s.count(old_sort)}')
          s = s.replace(old_sort, new_sort, 1)

          table_html_marker = """  <div class=\"table-wrap\">\n    <table>\n"""
          table_html_new = """  <div class=\"table-wrap\">\n    <div class=\"return-payoff-explainer\" aria-label=\"How this kind of real estate pays you\">\n      <div class=\"payoff-copy\">\n        <div class=\"payoff-title\">How this kind of real estate pays you</div>\n        <div class=\"payoff-subtitle\">3 real levers add up to the modeled return</div>\n      </div>\n      <div class=\"payoff-card cash\">\n        <span class=\"payoff-card-name\">Cash flow</span>\n        <span class=\"payoff-card-copy\">Actual — money<br>in your account<br>monthly</span>\n        <span class=\"payoff-op\" aria-hidden=\"true\">+</span>\n        <span class=\"payoff-arrow\" aria-hidden=\"true\"></span>\n      </div>\n      <div class=\"payoff-card principal\">\n        <span class=\"payoff-card-name\">Principal</span>\n        <span class=\"payoff-card-copy\">Actual — tenant<br>pays down your<br>loan debt</span>\n        <span class=\"payoff-op\" aria-hidden=\"true\">+</span>\n        <span class=\"payoff-arrow\" aria-hidden=\"true\"></span>\n      </div>\n      <div class=\"payoff-card appreciation\">\n        <span class=\"payoff-card-name\">Appreciation</span>\n        <span class=\"payoff-card-copy\">Forecast — 3% ×<br>3.33× leverage</span>\n        <span class=\"payoff-op\" aria-hidden=\"true\">=</span>\n        <span class=\"payoff-arrow\" aria-hidden=\"true\"></span>\n      </div>\n      <div class=\"payoff-card modeled\">\n        <span class=\"payoff-card-name\"><span class=\"payoff-mini-bars\" aria-hidden=\"true\"><i class=\"actual\"></i><i class=\"forecast\"></i></span>Modeled return</span>\n        <span class=\"payoff-card-copy\">The 3 to the left,<br>combined</span>\n        <span class=\"payoff-arrow\" aria-hidden=\"true\"></span>\n      </div>\n    </div>\n    <table>\n"""
          if s.count(table_html_marker) != 1:
              raise SystemExit(f'Expected one table HTML marker, found {s.count(table_html_marker)}')
          s = s.replace(table_html_marker, table_html_new, 1)

          js_old = 'let sortMode = "date_asc";'
          js_new = 'let sortMode = "date_desc";'
          if s.count(js_old) != 1:
              raise SystemExit(f'Expected one JS sort marker, found {s.count(js_old)}')
          s = s.replace(js_old, js_new, 1)

          path.write_text(s)
          PY
      - name: Commit updated page
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add return explainer above Open Book table"
          git push
