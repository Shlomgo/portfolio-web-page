name: One-time flat status rail fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Make each status rail one solid strip
        run: |
          python - <<'PY'
          from pathlib import Path

          css = Path('refined-theme.css')
          c = css.read_text()

          old = """tbody tr.data-row > td:first-child{\n  position:relative;\n  overflow:visible;\n  box-shadow:none!important;\n}\ntbody tr.data-row > td:first-child::before{\n  content:'';\n  position:absolute;\n  z-index:1;\n  left:0;\n  top:1px;\n  bottom:1px;\n  width:7px;\n  border-radius:6px 0 0 6px;\n  background:var(--row-status-color);\n  box-shadow:\n    inset 1px 0 0 rgba(255,255,255,.16),\n    inset -1px 0 0 rgba(0,0,0,.38),\n    1px 0 0 rgba(255,255,255,.025);\n  pointer-events:none;\n}\ntbody tr.data-row > td:first-child::after{\n  content:none!important;\n}\n"""

          new = """tbody tr.data-row > td:first-child{\n  position:relative;\n  overflow:visible;\n  box-shadow:none!important;\n  border-left:0!important;\n}\ntbody tr.data-row > td:first-child::before{\n  content:'';\n  position:absolute;\n  z-index:1;\n  left:0;\n  top:1px;\n  bottom:1px;\n  width:6px;\n  border:0!important;\n  border-radius:5px 0 0 5px;\n  background:var(--row-status-color)!important;\n  box-shadow:none!important;\n  outline:0!important;\n  pointer-events:none;\n}\ntbody tr.data-row > td:first-child::after{\n  content:none!important;\n  display:none!important;\n}\n"""

          if old not in c:
              raise SystemExit('Current status rail block not found')
          c = c.replace(old, new, 1)
          css.write_text(c)

          index = Path('index.html')
          s = index.read_text()
          old_key = 'refined-theme.css?v=20260904-4'
          new_key = 'refined-theme.css?v=20260904-5'
          if old_key not in s:
              raise SystemExit('Expected stylesheet cache key not found')
          s = s.replace(old_key, new_key, 1)
          index.write_text(s)
          PY

      - name: Commit flat rail fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html refined-theme.css
          git diff --cached --quiet && exit 0
          git commit -m "Use single solid status rail"
          git push origin HEAD:main
