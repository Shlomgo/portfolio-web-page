name: Fix property forecast color label

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-property-forecast-label.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct property page forecast legend wording
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for p in Path('properties').glob('*/index.html'):
              s = p.read_text(encoding='utf-8')
              s = s.replace('orange = forecast appreciation', 'blue = forecast appreciation')
              p.write_text(s, encoding='utf-8')
          Path('.github/workflows/fix-property-forecast-label.yml').unlink()
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Correct property page forecast legend color'
          git push
