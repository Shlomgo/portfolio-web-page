name: Add hide property status

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-hide-status.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add hide status support
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          comment_old = '// Turns a Status cell into one of the three codes the page understands.'
          comment_new = '// Turns a Status cell into one of the four codes the page understands.'
          if comment_old in text:
              text = text.replace(comment_old, comment_new, 1)

          parser_old = '  const s = String(raw||"").trim().toLowerCase();\n  if(s.includes("under")) return "under_contract";'
          parser_new = '  const s = String(raw||"").trim().toLowerCase();\n  if(s.includes("hide")) return "hide";\n  if(s.includes("under")) return "under_contract";'
          if parser_old not in text:
              raise SystemExit('Status parser target not found; no changes made.')
          text = text.replace(parser_old, parser_new, 1)

          filter_old = 'DATA = results.data.map(rowToRecord).filter(d=>d.state && !isNaN(d.price) && d.price > 0);'
          filter_new = 'DATA = results.data.map(rowToRecord).filter(d=>d.status !== "hide" && d.state && !isNaN(d.price) && d.price > 0);'
          if filter_old not in text:
              raise SystemExit('DATA filter target not found; no changes made.')
          text = text.replace(filter_old, filter_new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit source change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Support hide status for properties"
          git push
