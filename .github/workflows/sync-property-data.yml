name: Sync Open Book property data

on:
  # Primary path: the Google Sheet edit trigger dispatches this workflow
  # four minutes after the last edit.
  workflow_dispatch:

  # Run when this workflow changes so corrections can be verified immediately.
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-property-data.yml'

  # Periodic fallback: keep the live page current even if the Apps Script
  # edit trigger is missing, broken, or formula-only recalculations occur.
  # GitHub scheduled runs can be delayed; this is not a real-time guarantee.
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: write

concurrency:
  group: open-book-property-data-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and validate Google Sheet snapshot
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv, io, re, urllib.request

          html = Path('open-book.html').read_text()
          match = re.search(r'const SHEET_CSV_URL = "([^"]+)";', html)
          if not match:
              raise SystemExit('Could not find SHEET_CSV_URL in open-book.html')

          import time

          source_url = match.group(1)
          source_url += ('&' if '?' in source_url else '?') + f'_sync={int(time.time())}'
          request = urllib.request.Request(
              source_url,
              headers={
                  'User-Agent':'Mozilla/5.0 OpenBookDataSync/1.0',
                  'Cache-Control':'no-cache',
                  'Pragma':'no-cache',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              data = response.read()

          text = data.decode('utf-8-sig')
          reader = csv.DictReader(io.StringIO(text))
          required = {'Purchase Price', 'State', 'Status'}
          fields = set(reader.fieldnames or [])
          if not required.issubset(fields):
              raise SystemExit(f'Unexpected CSV headers. Missing: {sorted(required - fields)}')
          rows = list(reader)
          if not rows:
              raise SystemExit('Google Sheet returned no data rows')

          Path('property-data.csv.tmp').write_bytes(data)
          print(f'Validated {len(rows)} source rows')
          PY

      # This source is a second tab of the SAME Google workbook as Worksheet.
      # Keep the Open Book sync working even if this new tab is not yet published.
      - name: Fetch and validate published financing scenarios (optional)
        continue-on-error: true
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv, io, time, urllib.request

          source_url = (
              'https://docs.google.com/spreadsheets/d/e/'
              '2PACX-1vRj8OtOmCYZGVMYb1VSEgCmlVMcZC9b7Ie-Y_pPvcXzc1-D9ba_amLBxLFiDtXRfL0N7WCnVW-nZP45/'
              'pub?gid=2067891785&single=true&output=csv'
          ) + f'&_sync={int(time.time())}'
          request = urllib.request.Request(source_url, headers={
              'User-Agent': 'Mozilla/5.0 OpenBookFinancingSync/1.0',
              'Cache-Control': 'no-cache',
              'Pragma': 'no-cache',
          })
          with urllib.request.urlopen(request, timeout=30) as response:
              data = response.read()

          reader = csv.DictReader(io.StringIO(data.decode('utf-8-sig')))
          required = {
              'Property Page Slug', 'Scenario label', 'Status',
              'Validation / website eligibility', 'Total cash invested',
              'Mortgage P&I/month', 'Modeled total return/year'
          }
          missing = required.difference(reader.fieldnames or [])
          if missing:
              raise SystemExit(f'Financing scenarios source is not published or has wrong headers: {sorted(missing)}')
          rows = list(reader)
          if not any(row.get('Status') == 'Approved' and
                     row.get('Validation / website eligibility') == 'READY'
                     for row in rows):
              raise SystemExit('No approved and validated financing scenarios in published source')
          Path('financing-scenarios.csv.tmp').write_bytes(data)
          print(f'Validated {len(rows)} financing scenario rows')
          PY

      - name: Update same-origin snapshot if changed
        run: |
          mv property-data.csv.tmp property-data.csv
          git config user.name 'Open Book data sync'
          git config user.email 'actions@users.noreply.github.com'
          if [ -f financing-scenarios.csv.tmp ]; then
            mv financing-scenarios.csv.tmp financing-scenarios.csv
          fi
          git add property-data.csv financing-scenarios.csv
          if git diff --cached --quiet; then
            echo 'Property data snapshot is already current.'
            exit 0
          fi
          git commit -m 'Refresh property data snapshot'
          git pull --rebase origin main
          git push origin HEAD:main
