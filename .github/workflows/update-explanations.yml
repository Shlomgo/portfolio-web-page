name: Apply explanatory popup redesign

on:
  push:
    paths:
      - '.github/workflows/update-explanations.yml'

permissions:
  contents: write

jobs:
  patch-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Apply patch
        shell: bash
        run: |
          git show HEAD^:.github/workflows/update-explanations.yml \
            | sed -n "/python <<'PY'/,/^          PY$/p" \
            | sed '1d;$d' \
            | sed 's/^          //' > /tmp/update-explanations.py
          python /tmp/update-explanations.py

          git config user.name "Open Book updater"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/update-explanations.yml
          git add index.html
          git commit -m "Consolidate explanatory popups and methodology"
          git push
