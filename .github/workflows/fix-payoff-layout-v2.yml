name: Fix payoff layout v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-payoff-layout-v2.yml'

permissions:
  contents: write

jobs:
  fix-main-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply payoff layout correction
        run: python .github/fix_payoff_layout_v2.py
      - name: Commit corrected layout
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html changes to commit."
            exit 0
          fi
          git config user.name "Open Book UI update"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Fix payoff equation alignment and hybrid shading"
          git push origin main
