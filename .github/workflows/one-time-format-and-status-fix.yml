name: One-time formatting and status styling fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply requested formatting and status styling
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          s = index.read_text()

          old = '''const fmtNumber1 = n => Number.isFinite(n) ? n.toLocaleString("en-US",{minimumFractionDigits:1,maximumFractionDigits:1}) : "—";
          const fmt$ = n => Number.isFinite(n) ? "$" + fmtNumber1(n) : "—";
          const fmtPct = n => Number.isFinite(n) ? n.toFixed(1) + "%" : "—";
          const fmt1 = n => Number.isFinite(n) ? n.toFixed(1) : "—";
          const fmtLev = n => Number.isFinite(n) ? n.toFixed(1) : "—";'''.replace('          ','')
          new = '''const fmtNumber0 = n => Number.isFinite(n) ? n.toLocaleString("en-US",{minimumFractionDigits:0,maximumFractionDigits:0}) : "—";
          const fmt$ = n => Number.isFinite(n) ? "$" + fmtNumber0(n) : "—";
          const fmtPct = n => Number.isFinite(n) ? n.toFixed(1) + "%" : "—";
          const fmt1 = n => Number.isFinite(n) ? n.toFixed(1) : "—";
          const fmt0 = n => Number.isFinite(n) ? n.toFixed(0) : "—";
          const fmtLev = n => Number.isFinite(n) ? n.toFixed(1) : "—";'''.replace('          ','')
          if old not in s:
              raise SystemExit('Formatter block not found')
          s = s.replace(old, new, 1)

          old_math = 'toLocaleString("en-US",{minimumFractionDigits:1,maximumFractionDigits:1})'
          if old_math not in s:
              raise SystemExit('Math money formatter not found')
          s = s.replace(old_math, 'toLocaleString("en-US",{minimumFractionDigits:0,maximumFractionDigits:0})', 1)
          s = s.replace("const capexMath = Number(det.capex) === 0 ? '$0.0' : fmtMathMoney(det.capex);", "const capexMath = Number(det.capex) === 0 ? '$0' : fmtMathMoney(det.capex);", 1)

          # Percentages/multipliers that are not in the user's one-decimal list stay whole.
          s = s.replace('fmt1(downPct)', 'fmt0(downPct)')
          s = s.replace('fmtLev(purchaseLeverage)', 'fmt0(purchaseLeverage)')
          s = s.replace('fmt1(actualShare)', 'fmt0(actualShare)')
          s = s.replace('fmt1(predictedShare)', 'fmt0(predictedShare)')

          # Force a fresh stylesheet load for this visual change.
          if 'refined-theme.css?v=20260904-2' not in s:
              raise SystemExit('Expected stylesheet cache key not found')
          s = s.replace('refined-theme.css?v=20260904-2', 'refined-theme.css?v=20260904-3', 1)
          index.write_text(s)

          css = Path('refined-theme.css')
          c = css.read_text()

          old_status = '''.status-closed,
          .status-under_contract{
            background:var(--actual-fill)!important;
            color:var(--actual-primary)!important;
            border-color:var(--actual-border)!important;
            font-weight:600!important;
          }'''.replace('          ','')
          new_status = '''.status-closed{
            background:var(--actual-fill)!important;
            color:var(--actual-primary)!important;
            border-color:var(--actual-border)!important;
            font-weight:600!important;
          }
          .status-under_contract{
            background:var(--status-fill)!important;
            color:var(--status-text)!important;
            border-color:var(--status-border)!important;
            font-weight:500!important;
          }'''.replace('          ','')
          if old_status not in c:
              raise SystemExit('Combined closed/under-contract status block not found')
          c = c.replace(old_status, new_status, 1)

          old_rail = '''tbody tr.data-row.status-under_contract-row,
          tbody tr.data-row.status-closed-row{
            --row-status-color:var(--actual-primary);
          }'''.replace('          ','')
          new_rail = '''tbody tr.data-row.status-under_contract-row{
            --row-status-color:var(--status-text);
          }
          tbody tr.data-row.status-closed-row{
            --row-status-color:var(--actual-primary);
          }'''.replace('          ','')
          if old_rail not in c:
              raise SystemExit('Combined under-contract/closed rail block not found')
          c = c.replace(old_rail, new_rail, 1)
          css.write_text(c)

          print('Remaining fmt1 calls:')
          for line in s.splitlines():
              if 'fmt1(' in line:
                  print(line.strip())
          print('Remaining toFixed(1) occurrences:')
          for line in s.splitlines():
              if 'toFixed(1)' in line:
                  print(line.strip())
          PY
      - name: Commit requested changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html refined-theme.css
          git diff --cached --quiet && exit 0
          git commit -m "Refine status colors and numeric formatting"
          git push origin HEAD:main
